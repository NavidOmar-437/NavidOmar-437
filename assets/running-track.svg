<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Animated runner sprinting along a track toward the finish line" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2560"/>
      <stop offset="1" stop-color="#1a1640"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card">
      <rect width="800" height="250" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="800" height="250" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="90" cy="55" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="90" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="48" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="460" cy="82" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="52" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="96" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="62" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- moon -->
    <circle cx="690" cy="40" r="20" fill="#00f5ff" opacity="0.12"/>
    <circle cx="690" cy="40" r="12" fill="#00f5ff" opacity="0.22"/>

    <!-- title labels -->
    <text x="40" y="34" fill="#00f5ff" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5">&gt; HALF-MARATHON PROGRAM / 52 WEEKS</text>
    <text x="760" y="34" fill="#ff2d95" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="end">TARGET: SUB-2:00</text>

    <!-- skyline -->
    <g fill="#302b63" opacity="0.55">
      <rect x="20" y="118" width="34" height="32"/>
      <rect x="62" y="104" width="26" height="46"/>
      <rect x="96" y="124" width="40" height="26"/>
      <rect x="150" y="110" width="30" height="40"/>
      <rect x="196" y="126" width="44" height="24"/>
      <rect x="260" y="100" width="28" height="50"/>
      <rect x="300" y="120" width="36" height="30"/>
      <rect x="352" y="108" width="32" height="42"/>
      <rect x="398" y="124" width="46" height="26"/>
      <rect x="460" y="102" width="26" height="48"/>
      <rect x="498" y="118" width="38" height="32"/>
      <rect x="552" y="110" width="30" height="40"/>
      <rect x="598" y="126" width="44" height="24"/>
      <rect x="660" y="104" width="28" height="46"/>
      <rect x="702" y="120" width="40" height="30"/>
    </g>

    <!-- track surface -->
    <rect x="0" y="150" width="800" height="62" fill="url(#track)"/>
    <line x1="0" y1="150.5" x2="800" y2="150.5" stroke="#00f5ff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="171" x2="800" y2="171" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="22 14" opacity="0.35"/>
    <line x1="0" y1="192" x2="800" y2="192" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="22 14" opacity="0.35"/>
    <line x1="0" y1="211.5" x2="800" y2="211.5" stroke="#a855f7" stroke-width="2" opacity="0.7"/>

    <!-- finish line -->
    <g>
      <rect x="756" y="150" width="8" height="62" fill="#ffffff" opacity="0.9"/>
      <g fill="#0f0c29">
        <rect x="756" y="150" width="4" height="8"/><rect x="760" y="158" width="4" height="8"/>
        <rect x="756" y="166" width="4" height="8"/><rect x="760" y="174" width="4" height="8"/>
        <rect x="756" y="182" width="4" height="8"/><rect x="760" y="190" width="4" height="8"/>
        <rect x="756" y="198" width="4" height="8"/><rect x="760" y="206" width="4" height="6"/>
      </g>
      <text x="760" y="142" fill="#ffffff" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">FINISH</text>
    </g>


    <!-- RUNNER -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-40 132;840 132" dur="8s" repeatCount="indefinite"/>

      <!-- ground shadow -->
      <ellipse cx="2" cy="38" rx="17" ry="3.5" fill="#000000" opacity="0.4"/>

      <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- body bounce -->
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.35s" repeatCount="indefinite"/>

        <!-- BACK arm (purple) -->
        <g transform="translate(5 -28)" stroke="#a855f7" stroke-width="4.5">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="45 0 0;-40 0 0;45 0 0" dur="0.7s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="0" y2="13"/>
            <g transform="translate(0 13)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-70 0 0;-95 0 0;-70 0 0" dur="0.7s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="0" y2="12"/>
              </g>
            </g>
          </g>
        </g>

        <!-- BACK leg (purple) -->
        <g stroke="#a855f7" stroke-width="5">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-40 0 0;-3 0 0;35 0 0;-3 0 0;-40 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="0" y2="18"/>
            <g transform="translate(0 18)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="20 0 0;15 0 0;40 0 0;90 0 0;20 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="0" y2="18"/>
                <line x1="0" y1="18" x2="6" y2="19"/>
              </g>
            </g>
          </g>
        </g>

        <!-- torso -->
        <line x1="0" y1="0" x2="5" y2="-30" stroke="#00f5ff" stroke-width="6"/>

        <!-- head + headband -->
        <circle cx="9" cy="-40" r="6.5" fill="#00f5ff" stroke="none"/>
        <path d="M2.8 -41.5 Q9 -46 15.2 -41.5" stroke="#ff2d95" stroke-width="2"/>

        <!-- FRONT leg (cyan) -->
        <g stroke="#00f5ff" stroke-width="5">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-40 0 0;-3 0 0;35 0 0;-3 0 0;-40 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.7s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="0" y2="18"/>
            <g transform="translate(0 18)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="20 0 0;15 0 0;40 0 0;90 0 0;20 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.7s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="0" y2="18"/>
                <line x1="0" y1="18" x2="6" y2="19"/>
              </g>
            </g>
          </g>
        </g>

        <!-- FRONT arm (cyan) -->
        <g transform="translate(5 -28)" stroke="#00f5ff" stroke-width="4.5">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="45 0 0;-40 0 0;45 0 0" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="0" y2="13"/>
            <g transform="translate(0 13)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-70 0 0;-95 0 0;-70 0 0" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="0" y2="12"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- progress bar -->
    <rect x="40" y="224" width="720" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
    <rect x="40" y="224" width="0" height="6" rx="3" fill="#00f5ff">
      <animate attributeName="width" values="0;0;720;720" keyTimes="0;0.09;0.909;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="244" fill="#ffffff" opacity="0.6" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="10">0 KM</text>
    <text x="760" y="244" fill="#ffffff" opacity="0.6" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="10" text-anchor="end">21.1 KM</text>
  </g>

  <rect x="0.75" y="0.75" width="798.5" height="248.5" rx="15.5" fill="none" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
